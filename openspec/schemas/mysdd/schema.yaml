name: mysdd
version: 1
description: ISOライフサイクルおよび製品品質の観点を追加したspec-drivenのMySDD Fork
artifacts:
  - id: proposal
    generates: proposal.md
    description: 変更の概要を示す初期提案文書
    template: proposal.md
    instruction: |
      この変更が必要な理由（WHY）を示すProposalを作成する。

      セクション:
      - **Why**: 問題または機会を1～2文で記載する。何を解決するのか、なぜ今なのかを明確にする。
      - **What Changes**: 変更内容を箇条書きにする。新規Capability、変更、削除を具体的に記載し、破壊的変更には**BREAKING**を付ける。
      - **Capabilities**: 作成または変更するSpecを特定する。
        - **New Capabilities**: 導入するCapabilityを列挙する。各項目から `specs/<capability-path>/spec.md` を新規作成する。新たに導入するPath Segmentにはkebab-caseを使用し（例: `user-auth` または `identity/user-auth`）、Projectの既存Spec構成に従う。
        - **Modified Capabilities**: REQUIREMENTSを変更する既存Capabilityを列挙する。実装詳細ではなくSpec Levelの振る舞いが変わる場合だけ含め、各項目にDelta Specを作成する。`openspec/specs/` 配下の既存Pathを正確に使用し、Requirement変更がなければ空にする。
      - **Impact**: 影響を受けるCode、API、DependencyまたはSystemを記載する。
      - **Stakeholders and Lifecycle Impact**: ISO/IEC/IEEE 12207の適用可能な観点を用い、取得、供給、移行、運用、保守および廃止を確認する。適用しない観点には理由を記載する。
      - **Quality Considerations**: ISO/IEC 25010の製品品質特性を確認する。適用する特性、測定可能な目標および検証方法を特定し、適用しない特性には理由を記載する。

      ISOの観点は計画Levelに留める。要件定義書および基本設計書はproposeワークフローでは生成せず、後続のgenerate-prd Skillおよびgenerate-hld Skillで生成する。

      重要: CapabilitiesセクションはProposal PhaseとSpecs PhaseのContractになる。記載前に既存Specを調査する。ProjectのCapability一覧には `openspec list --specs` を使用し、関連しそうな項目には `openspec show "<spec-id>" --type spec --json --no-scenarios` を使用する。このCommandはCapabilityのPurposeとRequirement本文をScenarioなしで返す。登録済みStandalone Storeを使用する場合に限り、両Commandへ `--store "<id>"` を追加する。ChangeとSpecが同名の場合に曖昧な項目として扱われるため、`--type spec` を維持する。`--specs` のない `openspec list` は進行中のChangeだけを表示し、Projectがすでに扱うSpecは表示しない。類似名のCapabilityを新設せず、既存Capabilityの正確なPathを再利用する。この絞り込み結果は概要にすぎない。既存範囲または変更対象を判断する前に、関連する各Specを `openspec show "<spec-id>" --type spec` でScenarioを含めて最後まで読む。Store指定の規則は同じとする。ここに列挙した各Capabilityには、対応するSpec Fileが必要になる。

      各Changeでは、新規または変更対象のCapabilityを1つ以上宣言するか、Specを作成しないことを明示する。Deltaが0件でChangeの `.openspec.yaml` に `skip_specs: true` がない場合、`openspec validate` はChangeを拒否する。`skip_specs: true` は、純粋なRefactor、Tooling、Document変更など、Spec Levelの振る舞いが変わらない場合に限り使用する。Specは振る舞いを記述するため、振る舞いが変わらなければSpecも変更しない。検証を通すためだけにRequirementを作らない。

      1～2 Pageの簡潔な内容にする。実装詳細はdesign.mdに記載し、Proposalでは「how」ではなく「why」に集中する。

      このProposalを基礎として、Specs、DesignおよびTasksを作成する。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: 変更の詳細仕様
    template: spec.md
    instruction: |
      Systemが実現すべき内容（WHAT）を定義するSpec Fileを作成する。

      Specは実装計画ではなく、振る舞いのContractである。

      Specに含める内容:
      - UserまたはDownstream Systemが依存する観測可能な振る舞い
      - Input、OutputおよびError Condition
      - Security、Privacy、Reliability、Compatibilityなどの外部制約
      - Testまたは明示的な検証が可能なScenario
      - 適用するISO/IEC 25010品質要求について、品質ID、特性、測定量、目標値、条件および検証方法

      Specに含めない内容:
      - 内部Class名またはFunction名
      - LibraryまたはFrameworkの選択
      - 手順形式の実装詳細
      - 詳細な実行計画（design.mdまたはtasks.mdに記載する）

      簡易判定: 外部から観測できる振る舞いを変えずに実装を変更できる内容は、通常Specには含めない。

      ProposalのCapabilitiesセクションに列挙されたCapabilityごとに、Spec Fileを1つ作成する。`<capability-path>` は `specs/` からの相対Spec Directoryである（例: `user-auth` または `identity/user-auth`）。完全なPathを維持する。
      - New Capabilities: Proposalの正確なPathを使用して `specs/<capability-path>/spec.md` を作成する。Proposalで新たに導入する各Path Segmentにはkebab-caseを使用する。Projectの既存構成に従い、ProjectがFlat Layoutを使用している場合は新しいDomain Levelを追加しない。
      - Modified Capabilities: `openspec/specs/<capability-path>/` の正確な既存Pathを使用して、`specs/<capability-path>/spec.md` にDeltaを作成する。作成前に `openspec list --specs` でPathを確認する。登録済みStandalone Storeを使用する場合に限り `--store "<id>"` を追加する。Pathの入力ミスや新設したPathは、意図した既存Capabilityではなく存在しないCapabilityを対象にするため、Capabilityを移動または改名しない。

      Changeの `.openspec.yaml` に `skip_specs: true`（Spec Levelの振る舞いを変更しない）が設定されている場合を除き、Spec Fileを1つ以上作成する。Deltaが0件でこのMarkerがない場合、`openspec validate` はChangeを拒否する。ProposalにCapabilityがなく `skip_specs` も設定されていない場合は、先にProposalを見直す。

      Delta操作（`##` 見出しを使用する）:
      - **ADDED Requirements**: 新しいCapability
      - **MODIFIED Requirements**: 変更する振る舞い。更新後の内容を完全な形で含める
      - **REMOVED Requirements**: 廃止する機能。**Reason**および**Migration**を含める
      - **RENAMED Requirements**: 名称だけの変更。FROM:/TO:形式を使用する

      Format要件:
      - 各Requirement: `### Requirement: <name>` の後にRequirement本文を記載する
      - 規範的なRequirementにはSHALLまたはMUSTを使用し、shouldまたはmayは使用しない
      - 各Scenario: `#### Scenario: <name>` の後にWHEN/THEN形式で記載する
      - 重要: Scenarioには正確に4つのHash（`####`）を使用する。3つのHashまたは箇条書きを使用すると検出されない
      - すべてのRequirementに1つ以上のScenarioを含める

      New Capabilitiesの場合に限り、Delta Specの先頭へ `## Purpose` セクションを設ける。Capabilityの目的を1～2文かつ50文字以上で記載する。短すぎる場合、`openspec validate --strict` はErrorを報告する。Archive時にこの内容が新しいMain Specへ複製される。記載しない場合、Main Specには手動更新が必要な `TBD ... Update Purpose after archive` Placeholderが残る。既存CapabilityのDeltaには `## Purpose` を追加しない。既存SpecにはすでにPurposeがあり、Delta側のPurposeは無視される。残存する `TBD` を含め、既存CapabilityのPurposeを変更する場合は、`<planningHome.root>/openspec/specs/<capability-path>/spec.md` を直接編集する。`planningHome.root` は `openspec instructions ... --json` Responseから取得する。Repository相対Pathを推測せず、常にこの値を使用する。Changeが `--store`、Projectの `store:` Pointer、またはGlobal Default Storeに置かれている場合はStoreを指し、それ以外の場合は現在のRepositoryを指す。どのCaseかを独自に判定せず、取得済みFieldを使用する。

      MODIFIED Requirementsの手順:
      1. `<planningHome.root>/openspec/specs/<capability-path>/spec.md` で既存Requirementを特定する。`planningHome.root` には上記のStore対応Rootを使用する
      2. `### Requirement:` からすべてのScenarioまで、Requirement Block全体を複製する
      3. `## MODIFIED Requirements` の下へ貼り付け、新しい振る舞いに合わせて編集する
      4. 見出しTextが既存Requirementと正確に一致することを確認する。空白の差異は無視される

      よくある失敗: MODIFIEDへ一部分だけを記載すると、Archive時に既存の詳細が失われる。既存の振る舞いを変更せず新しい関心事を追加する場合は、MODIFIEDではなくADDEDを使用する。

      例（New Capabilityのため `## Purpose` から始める）:
      ```
      ## Purpose

      利用者が製品内のデータを移植可能な形式で取り出せるようにする。

      ## ADDED Requirements

      ### Requirement: 利用者がデータをエクスポートできる
      Systemは、利用者がすべてのデータをCSV形式でエクスポートできるようにしなければならない（SHALL）。

      #### Scenario: エクスポートに成功する
      - **WHEN** 利用者が「Export」Buttonを押す
      - **THEN** SystemがすべてのUser Dataを含むCSV FileをDownloadする

      ## REMOVED Requirements

      ### Requirement: 旧エクスポート機能
      **Reason**: 新しいExport Systemへ置き換えるため
      **Migration**: 新しいEndpoint `/api/v2/export` を使用する
      ```

      各ScenarioをTest Caseとして使用できるよう、Specを検証可能な内容にする。
    requires:
      - proposal

  - id: design
    generates: design.md
    description: 実装詳細を含む技術設計文書
    template: design.md
    instruction: |
      変更の実装方法（HOW）を説明するDesignを作成する。

      design.mdを作成する条件（いずれかに該当する場合だけ作成する）:
      - 複数のServiceまたはModuleにまたがる変更、もしくは新しいArchitecture Pattern
      - 新しい外部Dependencyまたは重要なData Model変更
      - Security、PerformanceまたはMigrationの複雑性
      - 実装前に技術判断を行うことで解消できる曖昧さ

      セクション:
      - **Context**: Approachの説明に必要な現在の状態および制約だけを記載する。動機を繰り返さず、Proposalを参照する（例: 「proposal.mdのWhyを参照」）。
      - **Goals / Non-Goals**: Designが達成する内容と、明示的に対象外とする内容を記載する。ProposalのScopeを繰り返さず、Design Levelの境界だけを追加する。
      - **Decisions**: 主要な技術選択、根拠（なぜXをYより選ぶのか）および検討した代替案を記載する。
      - **Quality Attribute Design**: 適用するISO/IEC 25010品質IDをDesign Approach、Trade-offおよび検証Evidenceへ対応付ける。
      - **Lifecycle, Migration and Operations**: ISO/IEC/IEEE 12207の適用可能な観点に基づき、移行、運用、保守、Supportおよび廃止を記載する。
      - **Risks / Trade-offs**: 既知の制約および問題になり得る事項を `[Risk] → Mitigation` 形式で記載する。
      - **Migration Plan**: 該当する場合、DeployまたはMigrationの手順とRollback Strategyを記載する。
      - **Open Questions**: Spec、選択したApproachまたはTask分解を変更せずに後で回答できる未知事項を記載する。該当しなければ省略する。

      Open Questionsには、先送りできる未知事項だけを記載し、未判断のDecisionを置かない。回答によってSpec、選択するApproachまたはTask分解が変わる場合は、その場でUserへ確認して解決し、推測しない。

      行単位の実装ではなく、ArchitectureおよびApproachに集中する。Proposalはwhyとwhat、Designはhowを扱う。動機はProposalを、Requirementは作成済みのSpecを参照する。既存内容を繰り返すだけのセクションは、元文書への参照に置き換える。

      良いDesignは技術判断の「why」を説明する。
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 追跡可能な実装Checklist
    template: tasks.md
    instruction: |
      実装作業を分割したTask Listを作成する。

      Tasksの作成前に、design.mdのOpen Questionsを確認する。構築対象が変わるQuestionは、Task Listへ明記されていない仮定を埋め込まず、先にUserと解決する。

      重要: 次のTemplateへ正確に従う。Apply PhaseはCheckbox形式を解析して進捗を追跡する。`- [ ]` を使用しないTaskは追跡されない。

      Guidelines:
      - 関連するTaskを番号付きの `##` 見出しでGroup化する
      - 各Taskは `- [ ] X.Y Task description` 形式のCheckboxにする
      - 各Taskを1 Sessionで完了できる大きさにする
      - Dependency順に並べる
      - 各Taskに、Test、Command、観測可能な振る舞いまたは納品Artifactによる完了確認方法を記載する。検証方法はTaskのCheckbox説明に含める。複数の実装TaskにまたがるIntegrationまたはSystem全体の振る舞いを確認する場合に限り、独立した検証Taskを使用する
      - 適用するISO/IEC 25010品質目標およびISO/IEC/IEEE 12207ライフサイクル影響について、TaskとEvidenceを含める

      例:
      ```
      ## 1. Setup

      - [ ] 1.1 新しいModule構成を作成し、想定したFileが存在することを確認する
      - [ ] 1.2 Dependencyをpackage.jsonへ追加し、Package Installationが成功することを確認する

      ## 2. Core Implementation

      - [ ] 2.1 Data Export Functionを実装し、Export Testが成功することを確認する
      - [ ] 2.2 CSV Formatting Utilityを追加し、Unit TestでQuoteとDelimiterを網羅する
      ```

      構築対象はSpecsを、構築方法はDesignを参照する。
    requires:
      - specs
      - design

apply:
  requires: [ tasks ]
  tracks: tasks.md
  instruction: |
    Context Fileを読み、未完了Taskを順に実施して、完了時にCheckboxを更新する。
    Blockerまたは確認が必要な事項が発生した場合は作業を停止する。
